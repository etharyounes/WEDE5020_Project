<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenSprout Community Garden - Volunteer & Plot Enquiry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <h1>GreenSprout NPO</h1>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="enquiry.html" class="active">Enquiry</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="form-container">
      <h2>Volunteer & Plot Rental Enquiry Form</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="fullname">Full Name *</label>
          <input type="text" id="fullname" name="fullname" required placeholder="e.g., Ethar Aboyounes">
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required placeholder="e.g., name@example.com">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number">
        </div>

        <div class="form-group">
          <label for="interest">Interest Type *</label>
          <select id="interest" name="interest" required>
            <option value="">-- Please Select --</option>
            <option value="volunteer">Volunteer Work</option>
            <option value="plot_rental">Garden Plot Rental</option>
            <option value="sponsorship">Community Sponsorship</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message / Special Requests</label>
          <textarea id="message" name="message" rows="5" placeholder="Tell us how you would like to get involved..."></textarea>
        </div>

        <button type="submit" class="btn">Submit Enquiry</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 GreenSprout Community Garden (NPO). All Rights Reserved.</p>
  </footer>
</body>
</html>
